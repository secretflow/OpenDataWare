version: 2.1

executors:
  java-maven-executor:
    docker:
      - image: cimg/openjdk:20.0
    working_directory: ~/project

jobs:
  test:
    executor: java-maven-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - maven-cache-v1-{{ checksum "pom.xml" }}
      - run:
          name: Run tests with coverage
          command: mvn test
      - save_cache:
          paths:
            - ~/.m2/repository
          key: maven-cache-v1-{{ checksum "pom.xml" }}

  lint:
    executor: java-maven-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - maven-cache-v1-{{ checksum "pom.xml" }}
      - run:
          name: Run lint check
          command: mvn checkstyle:check

workflows:
  version: 2
  ci-pipeline:
    jobs:
      - test
      - lint